name: Publish images

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # SQL is verified against the committed .sqlx cache, so the build needs no database.
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tweet_server/Dockerfile
          push: true
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/ax-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/ax-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

# Local development: PostgreSQL is the only external service.
# The backend applies migrations itself on startup.
# Host port 55432 (not 5432) so it does not collide with other local Postgres instances.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    shm_size: 128mb
    ports:
      - "${AX_PG_PORT:-55432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ax
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ax"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

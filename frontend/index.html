<!doctype html>
<html lang="en" data-theme="axlight">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Ax — a small micro-blogging app" />
    <meta name="theme-color" content="#f8f9fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1d26" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Ax</title>
    <script>
      // Apply the saved (or system) theme before first paint to avoid a light flash.
      (function () {
        var theme;
        try { theme = localStorage.getItem("ax-theme"); } catch (e) {}
        if (theme !== "axlight" && theme !== "axdark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "axdark" : "axlight";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
